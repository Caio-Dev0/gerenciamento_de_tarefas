<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="task-container">
        <header class="title-header">
            <h1>Lista de tarefas</h1>
        </header>
        <div class="task-header">
            <input class='task-input' type="text">
            <div class="priority">
                <label for="urgente">Urgente<input type="radio" name="prioridade" id="urgente" class="priority-urgente"></label>
                <label for="importante">Importante<input type="radio" name="prioridade" id="importante" class="priority-importante"></label>  
                <label for="rotineira">Rotineira<input type="radio" name="prioridade" id="rotineira" class="priority-rotineira"></label>
            </div>
            <button class="btn-add btn">Adicionar tarefa</button>
        </div>

        <ul class="task-list">
        </ul>

        <div class="edit-task-modal">
            <div class="container-edit-task">
                <label for="task-edit-input"></label>
                <input type="text" name="task-edit-input" id="task-edit-input">
            </div>
            <button class="btn-update btn">Atualizar Tarefa</button>
            <button class="btn-cancel btn">Cancelar</button>
        </div>
    </div>


<script src="/js/script.js" type="module"></script>
</body>
</html>
